name: Reusable Close ticket on merge

on:
  workflow_call:
    inputs:
      pr-number:
        description: Number of the merged pull request
        required: true
        type: string
      workflow-ref:
        description: Branch or commit SHA of AI-Dev-Workflow to run
        required: false
        type: string
        default: main
    secrets:
      NOTION_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  close-ticket:
    name: Set Notion Task to Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: AaronPG095/AI-Dev-Workflow
          ref: ${{ inputs.workflow-ref }}
          path: adw-cli
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Close tickets
        working-directory: repo
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: ADW_REPO_ROOT="$GITHUB_WORKSPACE/repo" node "$GITHUB_WORKSPACE/adw-cli/scripts/ticket.mjs" ci-done --pr-number "$PR_NUMBER"
